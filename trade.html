<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade | MilliTradez</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: white;
            text-align: center;
            margin: 0;
            padding: 40px;
        }
        h1 {
            color: #00c3ff;
        }
        .trade-box {
            background-color: #1a1a1a;
            border: 1px solid #00c3ff;
            padding: 20px;
            margin: 20px auto;
            width: 300px;
            border-radius: 10px;
        }
        button {
            background-color: #00c3ff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #009ed1;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Trading Page</h1>
    <div class="trade-box">
        <p>Start your crypto trades below</p>
        <button onclick="alert('Trading simulation started!')">Start Trade</button>
    </div>
    <a href="/">Back to Home</a>
</body>
</html>
