<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MilliTradez - Trade</title>
</head>
<body>
    <h1>Trade Dashboard</h1>
    <form action="/trade" method="post">
        <label for="pair">Choose Pair:</label>
        <select name="pair" id="pair">
            <option value="SOL/USDC">SOL/USDC</option>
            <option value="SOL/FLUX">SOL/FLUX</option>
            <option value="SOL/BONK">SOL/BONK</option>
        </select>
        <br><br>

        <label for="amount">Amount (SOL):</label>
        <input type="number" id="amount" name="amount" step="0.0001" required>
        <br><br>

        <label for="contract_address">Contract Address:</label>
        <input type="text" id="contract_address" name="contract_address" placeholder="Enter contract address" required>
        <br><br>

        <button type="submit">Execute Trade</button>
    </form>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
</body>
</html>
